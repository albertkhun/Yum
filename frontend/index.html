<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>YumVR</title>
  <meta
    name="description"
    content="Find PGs, hostels, and rentals in Manipur with immersive VR tours on YumVR."
  />
  <meta
    name="keywords"
    content="manipur rent, pg, hostel, vr rental, yumvr, rental platform, vr tours"
  />
  <meta name="author" content="YumVR" />
  <meta name="theme-color" content="#e85d04" />
  <meta name="application-name" content="YumVR" />
  <meta name="apple-mobile-web-app-title" content="YumVR" />
  <link rel="canonical" href="https://yumvr.tech/" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://yumvr.tech/" />
  <meta property="og:title"       content="YumVR" />
  <meta property="og:description" content="Find PGs, hostels, and rentals in Manipur with immersive VR tours on YumVR." />
  <meta property="og:site_name"   content="YumVR" />
  <meta property="og:image"       content="https://yumvr.tech/og-image.jpg" />

  <!-- Twitter -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="YumVR - VR Rental & Stay Platform" />
  <meta name="twitter:description" content="Find PGs, hostels, and rentals in Manipur with immersive VR tours on YumVR." />
  <meta name="twitter:image"       content="https://yumvr.tech/og-image.jpg" />

  <!-- Structured Data: Website -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "YumVR",
    "alternateName": "YumVr",
    "url": "https://yumvr.tech"
  }
  </script>

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "YumVR",
    "url": "https://yumvr.tech",
    "logo": "https://yumvr.tech/logo-512.png"
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <!--
    IMPORTANT: Use a relative path './src/main.jsx' so Vite can rewrite it
    correctly for both dev and production builds.
  -->
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
