services:
  
  - type: web
    name: yumvr-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      

  
  - type: web
    name: yumvr-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      
      - path: /assets/*.js
        name: Content-Type
        value: application/javascript; charset=utf-8
      # CSS
      - path: /assets/*.css
        name: Content-Type
        value: text/css; charset=utf-8
      
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      
      - path: /manifest.json
        name: Cache-Control
        value: public, max-age=86400
