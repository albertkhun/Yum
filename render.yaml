services:
  - type: web
    name: yumvr-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: yumvr-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /api/*
        destination: https://your-backend-url.onrender.com/api/:splat

      - type: rewrite
        source: /*
        destination: /index.html